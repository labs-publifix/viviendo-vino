name: Secuencia de correos (lista de espera)

# Cada hora le pide al sitio que envíe los correos de la secuencia que ya tocan.
# El sitio decide qué mandar; si nada toca, no hace nada. Requiere el secreto CRON_SECRET del repo.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Llamar al envío de la secuencia
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET no está configurado en el repo; no se hace nada."
            exit 0
          fi
          curl --fail-with-body -sS -m 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://www.viviendovino.com/api/cron/email-sequence
