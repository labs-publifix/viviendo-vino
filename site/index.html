<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viviendo Vino · Próximamente</title>
  <meta name="description" content="Viviendo Vino: kits exclusivos de vino, seleccionados para vivir cada copa. Muy pronto, nuestra tienda en línea.">
  <meta name="theme-color" content="#1A0B10">
  <meta property="og:title" content="Viviendo Vino · Próximamente">
  <meta property="og:description" content="Kits exclusivos de vino. Muy pronto, nuestra tienda en línea.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1A0B10;
      --bg-deep: #0F0609;
      --wine: #7A1F33;
      --cream: #F3EBDD;
      --cream-muted: #CDBFA9;
      --gold: #C9A96E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 80% 60% at 50% 38%, rgba(122, 31, 51, 0.45), transparent 70%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--cream);
      font-family: 'Montserrat', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      gap: 28px;
    }
    .logo { width: min(340px, 78vw); height: auto; }
    .eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      padding-left: 0.42em; /* compensa el tracking para centrar */
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.6rem, 8vw, 4.75rem);
      line-height: 1.05;
      letter-spacing: 0.01em;
    }
    h1 em { font-style: italic; color: var(--cream-muted); }
    .lead {
      max-width: 34rem;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--cream-muted);
    }
    footer {
      padding: 24px 16px 32px;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: rgba(205, 191, 169, 0.7);
    }
    @media (prefers-reduced-motion: no-preference) {
      .reveal { opacity: 0; transform: translateY(12px); animation: rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
      .reveal:nth-child(2) { animation-delay: .2s; }
      .reveal:nth-child(3) { animation-delay: .35s; }
      .reveal:nth-child(4) { animation-delay: .5s; }
      @keyframes rise { to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo reveal" src="assets/logo.svg" alt="Viviendo Vino" width="320" height="200">
    <p class="eyebrow reveal">Próximamente</p>
    <h1 class="reveal">Kits exclusivos,<br><em>para vivir cada copa.</em></h1>
    <p class="lead reveal">Estamos preparando nuestra tienda en línea con selecciones de vino pensadas para descubrir, regalar y compartir.</p>
  </main>
  <footer>
    © <span id="y">2026</span> Viviendo Vino · El consumo de alcohol es exclusivo para mayores de edad.
  </footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
