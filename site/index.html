<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viviendo Vino · Próximamente</title>
  <meta name="description" content="Viviendo Vino: kits exclusivos de vino. Muy pronto, nuestra tienda en línea.">
  <meta name="theme-color" content="#FAF8F6">
  <meta property="og:title" content="Viviendo Vino · Próximamente">
  <meta property="og:description" content="Kits exclusivos de vino. Muy pronto, nuestra tienda en línea.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF8F6;
      --ink: #1F1A1B;
      --muted: #6B6264;
      --wine: #9A2031;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', system-ui, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 16px;
    }
    .logo { width: min(360px, 72vw); height: auto; }
    .rule {
      width: 32px;
      height: 1px;
      background: var(--wine);
      margin: 56px 0 28px;
    }
    h1 {
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      padding-left: 0.32em; /* compensa el tracking para centrar */
    }
    p {
      margin-top: 14px;
      font-size: 0.9375rem;
      font-weight: 300;
      color: var(--muted);
    }
    footer {
      padding: 24px 16px 28px;
      text-align: center;
      font-size: 0.6875rem;
      color: var(--muted);
    }
    @media (prefers-reduced-motion: no-preference) {
      main > * { opacity: 0; animation: fade 1s ease-out forwards; }
      main > :nth-child(2) { animation-delay: .25s; }
      main > :nth-child(3) { animation-delay: .4s; }
      main > :nth-child(4) { animation-delay: .55s; }
      @keyframes fade { to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/logo.svg" alt="Viviendo Vino" width="786" height="250">
    <span class="rule" aria-hidden="true"></span>
    <h1>Próximamente</h1>
    <p>Kits exclusivos de vino.</p>
  </main>
  <footer>© <span id="y">2026</span> Viviendo Vino · Consumo exclusivo para mayores de edad.</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
